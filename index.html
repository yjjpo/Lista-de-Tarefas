<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Uma lista de tarefas fofa e simples">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <h1>Lista de Tarefas 🌸</h1>
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="O que você precisa fazer?" aria-label="Nova tarefa">
            <button id="addButton">Adicionar</button>
        </div>
        <ul id="taskList" aria-live="polite">
            <!-- Tarefas aparecerão aqui -->
        </ul>
    </main>
    <script src="script.js"></script>
</body>
</html>
